<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Rapido e seguro logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container col-12 d-flex justify-content-center">
        <form class="d-flex border-opacity-75 border-3 rounded p-4 flex-column col-5 bg-opacity-25 bg-dark" action="" method="post" class="container">
            <h5 class="mb-4">
                Rápido e Seguro Logistíca - Login
            </h5>

            <label class="" for="campo-email">Email</label>
            <input class="form-control form-control-sm mb-4" type="email" name="email" id="campo-email" required>
            
            <label class="label-primary" for="campo-senha">Senha</label>
            <input class="form-control form-control-sm" type="password" name="senha" id="campo-senha" required>

        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
