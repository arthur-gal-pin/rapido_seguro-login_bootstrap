<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Rapido e seguro logística</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="w-100 h-25 bg-warning d-flex justify-content-center p-3">
        <h1>Rápido e Seguro Logística</h1>
    </header>
    
    <main class="container min-vh-100 d-flex flex-column">
        <div class="row flex-grow-1 justify-content-center align-items-center">

            <form
                class="d-flex h-100 border-opacity-50 border-3 rounded justify-content-around p-4 flex-column col-sm-6 col-md-4 col-lg-4"
                style="height: 50vh;" action="" method="post" class="container">
                <h3 class="position-relative mt"> <span class="text-primary">Rápido e Seguro </span> <span
                        class="text-warning"> Logística </span> <br><br> Login</h3>
                <div class="d-flex flex-column w-100 align-items-center">
                    <div class="w-100">
                        <input class="mb-sm-3 mb-md-4 p-3 bg-transparent align w-100" type="email" name="email"
                            id="campo-email" required>
                        <label class="" for="campo-email">Digite seu email</label>
                    </div>

                    <div class="w-100">
                        <input class="mb-sm-3 mb-md-4 p-3 bg-transparent w-100" type="password" name="senha"
                            id="campo-senha" required>
                        <label class="" for="campo-senha">Digite sua senha</label>
                    </div>
                </div>
                <div class="flex-sm-column flex-column d-flex justify-content-center gap-2"  id="buttons">
                    <button type="submit" class="btn align-self-center btn-warning">
                        Entrar
                    </button>
                    <button class="bg-transparent border-0 text-decoration-underline link-primary">Esqueci minha
                        senha</button>
                </div>
            </form>

        </div>
    </main>
    <footer class="100 p-3 bg-warning d-flex justify-content-center">
        <p class="fs-4">&copy; Todos os direitos reservados, Rápido e seguro logística, 2026
        </p>
    </footer>
</body>

</html>
