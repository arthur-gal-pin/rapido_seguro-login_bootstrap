<!DOCTYPE html>
<html lang="pt-br"> <!-- Define que o documento é HTML5 e o idioma é português do Brasil -->

<head>
    <!-- Configuração de responsividade e codificação de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    
    <!-- Título da página exibido na aba do navegador -->
    <title>Rápido e Seguro Logística</title>

    <!-- Importação do CSS do Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Importação do CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <!-- Pré-conexão para melhorar desempenho no carregamento das fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Importação da fonte Oswald do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <!-- Importação do JavaScript do Bootstrap (inclui Popper) -->
    <!-- O atributo defer faz o script ser carregado após o HTML -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
</head>

<!-- Corpo da página com classes Bootstrap para layout flexível -->
<body class="d-flex flex-column min-vh-100">

    <!-- Cabeçalho da página -->
    <header class="container d-flex min-vw-100 mb-md-0 mb-sm-5">
        <div class="row border-bottom shadow-sm align-items-center vw-100">
            
            <!-- Coluna da logo -->
            <div class="col-3 col-md-4 text-center mb-md-0">
                <img src="./assets/logo.png" 
                     class="img-fluid rounded-circle float-end p-0" 
                     width="60%" 
                     id="logo"
                     alt="Logo da Empresa."> <!-- Texto alternativo para acessibilidade -->
            </div>

            <!-- Coluna do nome da empresa -->
            <div class="col-9 col-md-8 text-center text-md-start">
                <h1 class="h3 text-uppercase text-primary mb-0 float-start">
                    Rápido & Seguro Logística
                </h1>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="container min-vh-100 d-flex flex-column">
        <div class="row flex-grow-1 justify-content-center align-items-center">

            <!-- Formulário de login -->
            <form
                class="d-flex h-100 border-opacity-50 border-3 rounded justify-content-around p-4 flex-column col-sm-6 col-md-4 col-lg-4"
                style="height: 50vh;" 
                action="forms/forms.txt" 
                method="post"> <!-- Método POST para envio dos dados -->
                
                <!-- Título interno -->
                <h3 class="position-relative mt"> 
                    <span class="text-warning">Rápido e Seguro Logística</span>
                </h3>
                <br>

                <!-- Subtítulo -->
                <div class="text-center mb-2">
                    <h3>Login</h3>
                </div>

                <!-- Campos do formulário -->
                <div class="d-flex flex-column w-100 align-items-center">

                    <!-- Campo de email -->
                    <div class="w-100">
                        <input class="mb-sm-3 mb-md-4 p-3 bg-transparent align w-100" 
                               type="email" 
                               name="email"
                               id="campo-email" 
                               required> <!-- required obriga o preenchimento -->
                        <label for="campo-email">Digite seu email</label>
                    </div>

                    <!-- Campo de senha -->
                    <div class="w-100">
                        <input class="mb-sm-3 mb-md-4 p-3 bg-transparent w-100" 
                               type="password" 
                               name="senha"
                               id="campo-senha" 
                               required>
                        <label for="campo-senha">Digite sua senha</label>
                    </div>
                </div>

                <!-- Botões -->
                <div class="flex-sm-column flex-column d-flex justify-content-center gap-2" id="buttons">
                    
                    <!-- Botão de envio -->
                    <button type="submit" class="btn align-self-center btn-warning">
                        Entrar
                    </button>

                    <!-- Botão de recuperação de senha -->
                    <button class="bg-transparent border-0 text-decoration-underline link-primary">
                        Esqueci minha senha
                    </button>
                </div>
            </form>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="mt-3">
        <h5>&copy;Todos os direitos reservados.</h5>
    </footer>

</body>
</html>
